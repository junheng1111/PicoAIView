<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PicoClaw 实时编排系统</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/style.css?v=8">
</head>
<body>
    <div class="app-layout">
        <!-- 左侧控制面板 -->
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-icon">🎬</span>
                <span class="logo-text">PicoClaw</span>
            </div>

            <!-- 系统状态 -->
            <section class="card">
                <h3>系统状态</h3>
                <div class="status-grid">
                    <div class="status-row">
                        <span class="status-label">系统</span>
                        <span class="badge loading" id="sysStatus">检查中</span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">摄像头</span>
                        <span class="badge" id="cameraStatus">-</span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">BPU/YOLO</span>
                        <span class="badge" id="bpuStatus">-</span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">特效</span>
                        <span class="badge" id="fxStatus">-</span>
                    </div>
                </div>
            </section>

            <!-- 音乐库（已有音乐） -->
            <section class="card">
                <h3>音乐库
                    <button class="btn-icon" onclick="loadMusicLibrary()" title="刷新库">↺</button>
                </h3>
                <select id="musicLibrarySelect" class="select-input"
                        onchange="onLibrarySelect(this.value)">
                    <option value="">── 选择已有音乐 ──</option>
                </select>
                <div id="libraryHint" class="hint">加载中...</div>
            </section>

            <!-- 音乐上传 -->
            <section class="card">
                <h3>上传新音乐</h3>
                <input type="file" id="musicFile" accept="audio/*" style="display:none;">
                <button class="btn btn-primary w-full" onclick="document.getElementById('musicFile').click()">
                    📎 选择音乐文件
                </button>
                <p class="hint">支持 MP3 / WAV / FLAC</p>

                <div id="fileInfo" class="file-info hidden">
                    <p><strong>文件:</strong> <span id="fileName">-</span></p>
                    <p><strong>时长:</strong> <span id="fileDuration">-</span></p>
                </div>

                <div id="uploadProgress" class="hidden" style="margin-top:10px">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width:0%"></div>
                    </div>
                    <p id="progressText" class="hint">上传中: 0%</p>
                </div>
            </section>

            <!-- 操作控制 -->
            <section class="card">
                <h3>操作</h3>
                <button class="btn btn-success w-full" id="analyzeBtn" onclick="analyzMusic()" disabled>
                    🔍 分析节奏
                </button>
                <button class="btn btn-accent w-full" id="choreBtn" onclick="generateChoreo()" disabled>
                    ✨ 生成编排
                </button>
                <button class="btn w-full" id="previewBtn" onclick="togglePreview()" disabled>
                    ▶ 开始预览
                </button>
                <button class="btn btn-secondary w-full" onclick="reset()">
                    🔄 重置
                </button>
            </section>

            <!-- FX 测试区 -->
            <section class="card">
                <h3>FX 测试区
                    <button class="btn-icon" onclick="fxTestClearAll()" title="清除全部">✕ 全部</button>
                </h3>
                <select id="fxTestSelect" class="select-input" onchange="renderFxChips()"></select>
                <div class="theme-strength-row" style="display:flex;align-items:center;gap:6px;margin:6px 0;">
                    <label class="hint" style="white-space:nowrap">强度</label>
                    <input type="range" id="fxTestIntensity" min="0" max="100" value="80"
                           oninput="document.getElementById('fxTestIntensityVal').textContent=this.value+'%'"
                           style="flex:1">
                    <span class="hint" id="fxTestIntensityVal">80%</span>
                </div>
                <button class="btn btn-accent w-full" onclick="fxTestToggle()">▶ 激活</button>
                <div id="fxTestActive" class="fx-chip-list"></div>
            </section>

            <!-- 常驻基础效果 -->
            <section class="card">
                <h3>常驻效果</h3>
                <div class="live-fx-list">
                    <div class="live-fx-row">
                        <label class="live-fx-label">
                            <input type="checkbox" id="lfSubjectZoom" checked
                                   onchange="onLiveFxToggle()">
                            主体跟焦
                        </label>
                        <input type="range" id="lfSubjectZoomAmp" min="0" max="200" value="100"
                               oninput="onLiveFxSlider(this, 'lfSubjectZoomAmpVal')"
                               class="live-fx-slider">
                        <span class="live-fx-val" id="lfSubjectZoomAmpVal">100%</span>
                    </div>
                    <div class="live-fx-row">
                        <label class="live-fx-label">
                            <input type="checkbox" id="lfZoomPulse" checked
                                   onchange="onLiveFxToggle()">
                            节拍缩放
                        </label>
                        <input type="range" id="lfZoomPulseAmp" min="0" max="200" value="100"
                               oninput="onLiveFxSlider(this, 'lfZoomPulseAmpVal')"
                               class="live-fx-slider">
                        <span class="live-fx-val" id="lfZoomPulseAmpVal">100%</span>
                    </div>
                    <div class="live-fx-row">
                        <label class="live-fx-label">
                            <input type="checkbox" id="lfBrightness" checked
                                   onchange="onLiveFxToggle()">
                            呼吸亮度
                        </label>
                        <input type="range" id="lfBrightnessAmp" min="0" max="200" value="100"
                               oninput="onLiveFxSlider(this, 'lfBrightnessAmpVal')"
                               class="live-fx-slider">
                        <span class="live-fx-val" id="lfBrightnessAmpVal">100%</span>
                    </div>
                </div>
            </section>

            <!-- 主题滤镜 -->
            <section class="card">
                <h3>主题滤镜</h3>
                <select id="themeSelect" class="select-input" onchange="applyTheme(this.value)">
                    <option value="">── 无主题（原色）──</option>
                </select>
                <div class="theme-strength-row" style="display:flex;align-items:center;gap:6px;margin-top:6px;">
                    <label class="hint" style="white-space:nowrap">强度</label>
                    <input type="range" id="themeStrength" min="0" max="100" value="60"
                           oninput="applyTheme(document.getElementById('themeSelect').value)"
                           style="flex:1">
                    <span id="themeStrengthVal" class="hint">60%</span>
                </div>
            </section>

            <!-- 任务进度 -->
            <section class="card" id="taskSection" style="display:none;">
                <h3>任务进度</h3>
                <div id="taskStatus" class="hint">-</div>
            </section>

            <!-- 编排列表 -->
            <section class="card" id="choreoSummary" style="display:none;">
                <h3>编排列表
                    <button class="btn-icon" onclick="openChoreoDialog()" title="新建编排">＋</button>
                </h3>
                <div id="choreoList" class="choreo-list"></div>
            </section>
        </aside>

        <!-- 主视频区 -->
        <main class="main-area">
            <div class="video-wrapper" style="position:relative">
                <img id="videoStream" class="video-stream"
                     src="/api/video/stream"
                     alt="实时摄像头流"
                     onerror="handleStreamError(this)" />
                <div class="video-overlay">
                    <span id="subjectCount" class="overlay-badge">人数: 0</span>
                    <span id="fxActive" class="overlay-badge hidden">FX: -</span>
                    <span id="themeActive" class="overlay-badge hidden">主题: -</span>
                </div>
            </div>

            <!-- 底部信息栏 -->
            <div class="bottom-bar">
                <div class="bottom-item">
                    <span class="bottom-label">BPM:</span>
                    <span id="beatInfo">-</span>
                </div>
                <div class="bottom-item">
                    <span class="bottom-label">当前特效:</span>
                    <span id="currentFx">-</span>
                </div>
                <div class="bottom-item">
                    <span class="bottom-label">音乐时间:</span>
                    <span id="audioTime">0.0s</span>
                </div>
                <div class="bottom-item ws-status">
                    <span id="wsIndicator" class="ws-dot disconnected"></span>
                    <span id="wsLabel">WS 未连接</span>
                </div>
            </div>
        </main>
    </div>

    <audio id="audioPlayer" preload="none" style="display:none"></audio>

    <!-- 新建编排对话框 -->
    <div id="choreoModal" class="modal-overlay hidden">
        <div class="modal">
            <h2>✨ 新建编排</h2>
            <p class="modal-desc">告诉 AI 你想要什么风格（留空则使用 energetic 默认）：</p>
            <textarea id="styleInput" class="style-textarea" rows="3"
                placeholder="例：甜美偶像风，副歌要有爆发感，intro 温柔粉色系，间奏可以神秘迷幻…"></textarea>
            <div class="style-tags">
                <button class="style-tag" onclick="setStyleTag('动感电音 EDM，高能量，副歌 drop 爆发')">⚡ 动感</button>
                <button class="style-tag" onclick="setStyleTag('甜美偶像风 J-pop，粉色系，温柔闪亮')">🌸 甜美</button>
                <button class="style-tag" onclick="setStyleTag('复古 indie 民谣，vintage 褪色感，慵懒')">🌙 复古</button>
                <button class="style-tag" onclick="setStyleTag('电影感 cinematic teal-orange，商业MV 大气')">🎬 电影感</button>
                <button class="style-tag" onclick="setStyleTag('赛博朋克 neon 霓虹，夜店电子，科技感')">🌃 夜店</button>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeChoreoDialog()">取消</button>
                <button class="btn btn-accent" onclick="confirmChoreo()">✨ 开始生成</button>
            </div>
        </div>
    </div>

    <script src="/static/app.js?v=8"></script>
</body>
</html>
